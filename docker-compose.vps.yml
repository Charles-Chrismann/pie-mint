services:
  db:
    image: imresamu/postgis
    container_name: mint-vps-db
    restart: always
    ports:
      - ${PG_PORT}:5432
    shm_size: 128mb
    env_file:
      - .env.db
  
  s3:
    container_name: mint-s3
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ROOTNAME
      MINIO_ROOT_PASSWORD: CHANGEME123
    command: server /data --console-address ":9001"

  s3-setup:
    container_name: mint-s3-setup
    image: minio/mc
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      echo '⏳ Waiting for MinIO...';
      until (mc alias set mint http://s3:9000 ROOTNAME CHANGEME123) do sleep 2; done;
      mc mb mint/mint-dev || true;
      mc anonymous set download mint/mint-dev;
      echo '✅ Bucket public prêt !';
      "

  adminer:
    image: adminer
    container_name: mint-vps-adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080

  mint-api:
    image: charleschrismann/mint-api
    container_name: mint-vps-api
    env_file:
      - .env.api
    ports:
      - ${API_PORT}:3000

    depends_on:
      - db
      - adminer
    restart: always

  mint-admin:
    image: charleschrismann/mint-admin
    container_name: mint-vps-admin
    ports:
      - ${ADMIN_PORT}:80
    env_file:
      - .env.admin
    restart: always

  mint-ws:
    image: charleschrismann/mint-ws
    container_name: mint-vps-ws
    ports:
      - ${WS_PORT}:3000
    env_file:
      - .env.ws
    restart: always

volumes:
  mint-vps-db-data:
