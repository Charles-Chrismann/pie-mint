name: Build & Deploy Mint API + Front

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Check changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'mint-server/**'
            front:
              - 'mint-administration/**'

  build-api:
    name: Build & Push mint-api Docker image
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push mint-api Docker image with cache
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=charleschrismann/mint-api:buildcache \
            --cache-to=type=registry,ref=charleschrismann/mint-api:buildcache,mode=max \
            -t charleschrismann/mint-api:latest \
            --push ./mint-server/

  build-front:
    name: Build & Push mint-administration Docker image
    needs: detect-changes
    if: needs.detect-changes.outputs.front == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build mint-administration
        working-directory: ./mint-administration
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push mint-administration Docker image with cache
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=charleschrismann/mint-administration:buildcache \
            --cache-to=type=registry,ref=charleschrismann/mint-administration:buildcache,mode=max \
            -t charleschrismann/mint-administration:latest \
            --push ./mint-administration/

  deploy:
    name: SSH Deploy on Server
    needs: [build-api, build-front]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deploy if a build succeeded
        if: |
          needs.build-api.result == 'success' || needs.build-front.result == 'success'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd mint/pie-mint/

            git checkout main
            git pull

            echo "Pull des dernières images..."
            docker compose -f docker-compose.vps.yml pull mint-api
            docker compose -f docker-compose.vps.yml pull mint-administration

            docker exec mint-vps-api ./scripts/i.sh

            echo "Relancement des services..."
            docker compose -f docker-compose.vps.yml up -d mint-api mint-administration

      - name: Skip deploy (no build succeeded)
        if: |
          needs.build-api.result != 'success' && needs.build-front.result != 'success'
        run: echo "Aucun build exécuté ou réussi. Le déploiement est ignoré."
