name: Build & Deploy Mint API + Front

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Push Docker images, Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------- BUILD FRONT ----------
      - name: Install and build mint-administration
        working-directory: ./mint-administration
        run: |
          npm ci
          npm run build

      # ---------- DOCKER ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- Build and push API
      - name: Build and Push mint-api Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t charleschrismann/mint-api:latest \
            --push ./mint-server/

      # --- Build and push FRONT (mint-administration)
      - name: Build and Push mint-administration Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t charleschrismann/mint-administration:latest \
            --push ./mint-administration/

      # ---------- DEPLOY ----------
      - name: SSH and Deploy on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd mint/

            echo "Pull des dernières images..."
            docker compose -f docker-compose.prod.yml pull mint-api
            docker compose -f docker-compose.prod.yml pull mint-administration

            echo "Relancement des services..."
            docker compose -f docker-compose.prod.yml up -d mint-api mint-administration
