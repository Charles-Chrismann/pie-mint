name: Build & Deploy Mint Turbo Monorepo

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect changed turborepo packages
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      admin: ${{ steps.filter.outputs.admin }}
      ws: ${{ steps.filter.outputs.ws }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes using paths-filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/mint-api/**'
            admin:
              - 'apps/mint-admin/**'
            ws:
              - 'apps/mint-ws-runners/**'

  # =========================================================
  # API BUILD
  # =========================================================
  build-api:
    name: Build & Push mint-api
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Build API via Turborepo
        run: pnpm turbo run build --filter=mint-api...

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker buildx push API
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=charleschrismann/mint-api:buildcache \
            --cache-to=type=registry,ref=charleschrismann/mint-api:buildcache,mode=max \
            --target mint-api-runtime \
            -t charleschrismann/mint-api:latest \
            --push .

  # =========================================================
  # ADMIN FRONT BUILD
  # =========================================================
  build-admin:
    name: Build & Push mint-admin
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Build Admin via Turborepo
        run: pnpm turbo run build --filter=mint-admin...

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker buildx push Admin
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=charleschrismann/mint-admin:buildcache \
            --cache-to=type=registry,ref=charleschrismann/mint-admin:buildcache,mode=max \
            --target mint-admin-runtime \
            -t charleschrismann/mint-admin:latest \
            --push .

  # =========================================================
  # WS RUNNERS BUILD
  # =========================================================
  build-ws:
    name: Build & Push mint-ws-runners
    needs: detect-changes
    if: needs.detect-changes.outputs.ws == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Build WS-Runners via Turborepo
        run: pnpm turbo run build --filter=mint-ws-runners...

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker buildx push WS runners
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=charleschrismann/mint-ws-runners:buildcache \
            --cache-to=type=registry,ref=charleschrismann/mint-ws-runners:buildcache,mode=max \
            --target mint-ws-runners-runtime \
            -t charleschrismann/mint-ws-runners:latest \
            --push .

  # =========================================================
  # DEPLOY
  # =========================================================
  deploy:
    name: Deploy to VPS
    needs: [build-api, build-admin, build-ws]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deploy if something was built
        if: |
          needs.build-api.result == 'success' ||
          needs.build-admin.result == 'success' ||
          needs.build-ws.result == 'success'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd mint/pie-mint/

            git checkout main
            git pull

            echo "Pulling latest images..."
            docker compose -f docker-compose.vps.yml pull

            docker exec mint-vps-api ./scripts/i.sh

            echo "Restarting services..."
            docker compose -f docker-compose.vps.yml up -d

      - name: Nothing to deploy
        if: |
          needs.build-api.result != 'success' &&
          needs.build-admin.result != 'success' &&
          needs.build-ws.result != 'success'
        run: echo "No build succeeded, skipping deployment."
