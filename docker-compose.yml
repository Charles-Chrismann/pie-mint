services:
  db:
    container_name: mint-db
    image: postgis/postgis
    volumes:
      - mint-db-data:/var/lib/postgresql/data
    restart: always
    ports:
      - 5432:5432
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example

  s3:
    container_name: mint-s3
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ROOTNAME
      MINIO_ROOT_PASSWORD: CHANGEME123
    command: server /data --console-address ":9001"

  s3-setup:
    container_name: mint-s3-setup
    image: minio/mc
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      echo '⏳ Waiting for MinIO...';
      until (mc alias set mint http://s3:9000 ROOTNAME CHANGEME123) do sleep 2; done;
      mc mb mint/mint-dev || true;
      mc anonymous set download mint/mint-dev;
      echo '✅ Bucket public prêt !';
      "

  redis:
    container_name: mint-redis
    image: redis:8.4-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  adminer:
    container_name: mint-adminer
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  mint-db-data: